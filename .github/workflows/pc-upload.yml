name: PC videos to YouTube queue

# Videos made on the PC arrive in incoming/ (split into small parts + a .json card).
on:
  push:
    paths: ["incoming/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-upload
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyyaml
      - name: Join parts, publish, queue for YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python maker/pc_upload.py
      - name: Save
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -A incoming feeds results.md
          git diff --cached --quiet && exit 0
          git commit -m "PC video published and queued [skip ci]"
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash; done
          exit 1
