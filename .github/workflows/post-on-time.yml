name: Post on time (Zapier feeds)

# Some channels (see post_times_utc in config.yml) don't post right after a video is made.
# The video waits in feeds/pending/ and this moves ONE waiting video per channel into its
# feed at each posting time; Zapier then uploads it to YouTube.
# Every 2 hours it also checks each channel's public YouTube list and notes which of our
# videos are really on YouTube (feeds/live.json) - Shorts Studio shows a mark for those.
on:
  schedule:
    - cron: "0 15,22 * * *"    # posting times: 15:00 and 22:00 UTC (10 AM and 5 PM New York)
    - cron: "25 */2 * * *"     # "is it on YouTube yet?" check
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-on-time
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyyaml
      - name: Release the next waiting video of each channel
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15,22 * * *'
        run: |
          if ls feeds/pending/*.json >/dev/null 2>&1 && grep -q '"link"' feeds/pending/*.json; then
            python maker/feeds.py release
          else
            echo "Nothing waiting."
          fi
      - name: Which videos are on YouTube now?
        continue-on-error: true
        run: python maker/feeds.py check
      - name: Save
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet && exit 0
          git commit -m "Feeds: posting queue / YouTube marks [skip ci]"
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash; done
          exit 1
