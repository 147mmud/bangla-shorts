name: Post on time (Zapier feeds)

# Some channels (see post_times_utc in config.yml) don't post right after a video is made.
# The video waits in feeds/pending/ and this moves ONE waiting video per channel into its
# feed at each posting time; Zapier then uploads it to YouTube.
on:
  schedule:
    - cron: "0 15,22 * * *"   # 15:00 and 22:00 UTC (10 AM and 5 PM New York)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-on-time
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Anything waiting?
        id: check
        run: |
          if ls feeds/pending/*.json >/dev/null 2>&1 && grep -q '"link"' feeds/pending/*.json; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; echo "Nothing waiting."; fi
      - name: Release the next video of each channel
        if: steps.check.outputs.go == 'yes'
        run: |
          pip install -q pyyaml
          python maker/feeds.py release
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet && exit 0
          git commit -m "Post on time: release waiting video(s) [skip ci]"
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash; done
          exit 1
